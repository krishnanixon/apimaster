type: collection.insomnia.rest/5.0
name: Billing API
meta:
  id: wrk_9d1c2f
  created: 1759000000000
  modified: 1759100000000
  description: Invoices and customers
collection:
  - name: Customers
    meta:
      id: fld_customers
      created: 1759000000001
      modified: 1759000000001
      sortKey: 100
    authentication:
      type: bearer
      token: "{{ _.token }}"
    headers:
      - name: X-Client
        value: shurikly-test
    scripts:
      preRequest: insomnia.environment.set('ts', String(Date.now()));
    children:
      - url: "{{ _.baseUrl }}/customers/{id}"
        name: Get customer
        meta:
          id: req_get_customer
          created: 1759000000002
          modified: 1759000000002
          isPrivate: false
          description: Fetch one customer
          sortKey: 200
        method: GET
        parameters:
          - name: expand
            value: invoices
        headers:
          - name: Accept
            value: application/json
        authentication: {}
        scripts:
          afterResponse: |-
            insomnia.test("ok", function () {
              insomnia.response.to.have.status(200);
            });
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.baseUrl }}/customers"
        name: Create customer
        meta:
          id: req_create_customer
          sortKey: 300
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "email": "{{ _.email }}",
              "plan": "pro"
            }
        headers:
          - name: Content-Type
            value: application/json
        authentication:
          type: digest
          username: billing
          password: "{{ _.digestPassword }}"
  - url: "{{ _.baseUrl }}/invoices/latest"
    name: Latest invoice
    meta:
      id: req_latest_invoice
      sortKey: 400
    method: GET
    authentication:
      type: hawk
      id: hawk-id
      key: hawk-key
      algorithm: sha1
  - url: "{{ _.baseUrl }}/legacy"
    name: Legacy endpoint
    meta:
      id: req_legacy
      sortKey: 500
    method: GET
    authentication:
      type: oauth1
      consumerKey: ck
      consumerSecret: cs
      tokenKey: tk
      tokenSecret: ts
      signatureMethod: RSA-SHA1
  - url: wss://billing.example.com/events
    name: Billing events
    meta:
      id: ws-req_events
      sortKey: 600
cookieJar:
  name: Default Jar
  meta:
    id: jar_1
environments:
  name: Base Environment
  meta:
    id: env_base
  data:
    baseUrl: http://localhost:8080
    email: dev@example.com
  subEnvironments:
    - name: Staging
      meta:
        id: env_staging
      data:
        baseUrl: https://billing.staging.example.com
        token: staging-token
    - name: Production
      meta:
        id: env_prod
      data:
        baseUrl: https://billing.example.com
